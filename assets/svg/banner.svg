<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="640"
     viewBox="0 0 1280 640">

<rect width="100%" height="100%" fill="#0D1117"/>

<defs>
    <linearGradient id="accent" x1="0" x2="1">
        <stop offset="0" stop-color="#3FB950"/>
        <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
</defs>

<rect
    x="60"
    y="50"
    rx="12"
    ry="12"
    width="1160"
    height="540"
    fill="#161B22"
    stroke="#30363D"
    stroke-width="2"/>

<circle cx="95" cy="85" r="7" fill="#ff5f56"/>
<circle cx="120" cy="85" r="7" fill="#ffbd2e"/>
<circle cx="145" cy="85" r="7" fill="#27c93f"/>

<text
x="180"
y="92"
font-family="JetBrains Mono, Consolas, monospace"
font-size="22"
fill="#8B949E">
GitHub Terminal
</text>

<text
x="90"
y="150"
font-family="JetBrains Mono, Consolas, monospace"
font-size="24"
fill="#58A6FF">
anil@github:~$ ./welcome.sh
</text>

<rect x="550" y="128" width="14" height="28" fill="#3FB950">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>

<text
x="90"
y="230"
font-family="JetBrains Mono, Consolas, monospace"
font-size="46"
font-weight="bold"
fill="#C9D1D9">
Hello, I'm Anil Rijal 👋
<animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze"/>
</text>

<text
x="90"
y="295"
font-family="JetBrains Mono, Consolas, monospace"
font-size="30"
fill="url(#accent)">
BSc.CSIT Student
<animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
</text>

<text
x="90"
y="350"
font-family="JetBrains Mono, Consolas, monospace"
font-size="24"
fill="#C9D1D9">
Backend Developer
</text>

<text
x="90"
y="430"
font-family="JetBrains Mono, Consolas, monospace"
font-size="22"
fill="#C9D1D9">
Python • Django • JavaScript • HTML • CSS
</text>

<text
x="90"
y="500"
font-family="JetBrains Mono, Consolas, monospace"
font-size="22"
fill="#8B949E">
Learning by building scalable web applications.
</text>

</svg>
